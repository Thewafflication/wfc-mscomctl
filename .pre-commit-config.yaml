# @file .pre-commit-config.yaml
# @brief Library commit gate: lint, then the standalone build and its tests
#        (WSP-CHECK-0001). The first hook takes the machine-wide gate lock
#        shared with WFC and opens the test progress window.
# @note Install once with: pre-commit install
minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: wfc-gate-start
        name: WFC gate start (single instance, progress window)
        entry: pwsh -NoProfile -File scripts/Start-CommitGate.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: lib-lint
        name: Library lint
        entry: pwsh -NoProfile -File scripts/Invoke-Lint.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: lib-build
        name: Library build (standalone, x64 debug)
        entry: pwsh -NoProfile -File scripts/Invoke-Build.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: lib-tests
        name: Library tests (standalone, x64 debug)
        entry: pwsh -NoProfile -File scripts/Invoke-Tests.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
